<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Cell Arena Admin</title><link rel="stylesheet" href="style.css"></head><body class=admin><div id=app class=panel><h1>👑 CELL ARENA ADMIN PANEL</h1><div id=login class=box><input id=p placeholder="Admin şifresi" type=password><button class=ok onclick=login()>GİRİŞ</button><small>Varsayılan: admin123</small></div><div id=content style="display:none"><div class=box><button class=danger onclick=clearAll()>TÜM OYUNCULARI ÇIKAR</button> <button onclick=load()>YENİLE</button></div><h2>Oyuncular</h2><table><thead><tr><th>İsim</th><th>Kütle</th><th>İşlem</th></tr></thead><tbody id=rows></tbody></table><h2>Skin yükle</h2><form id=form><input type=file name=skin accept="image/png,image/jpeg,image/webp"><button class=ok>YÜKLE</button></form><div id=skins></div></div></div><script>
let token;async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:"admin",password:p.value})}),j=await r.json();if(!r.ok)return alert(j.error);token=j.token;document.getElementById("login").style.display="none";content.style.display="block";load();skinsLoad()}async function load(){let r=await fetch("/api/admin/players",{headers:{Authorization:"Bearer "+token}}),j=await r.json();rows.innerHTML=j.players.map(a=>`<tr><td>${a.id}</td><td>${Math.floor(a.m)}</td><td><button onclick="kick('${a.id}')">Kick</button> <button class=danger onclick="ban('${a.id}')">Ban</button></td></tr>`).join("")}async function act(url,name){await fetch(url,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({name})});load()}function kick(n){act("/api/admin/kick",n)}function ban(n){act("/api/admin/ban",n)}function clearAll(){act("/api/admin/clear","")}form.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/skins",{method:"POST",headers:{Authorization:"Bearer "+token},body:new FormData(form)});if(r.ok)skinsLoad()};async function skinsLoad(){let r=await fetch("/api/skins",{headers:{Authorization:"Bearer "+token}});if(!r.ok)return;let j=await r.json();skins.innerHTML=j.skins.map(s=>`<img src="${s}" width=80 style="margin:8px;border-radius:50%">`).join("")}
</script></body></html>
